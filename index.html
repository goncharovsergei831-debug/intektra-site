<head>

  <meta property="og:description" content="Оптовые поставки ОПС, видеонаблюдения, СКУД и защитного оборудования ЗС ГО в Санкт-Петербурге и по всей России. НДС 22%.">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-hover: #ffffff;
      --border: #e2e8f0;
      --border-accent: rgba(225, 29, 72, 0.25);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --red-accent: #e11d48;
      --red-glow: rgba(225, 29, 72, 0.15);
      --cyan-accent: #0284c7;
      --green-stock: #16a34a;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      overflow-x: hidden;
      background-image: 
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(225, 29, 72, 0.05), transparent 60%),
        radial-gradient(circle at 100% 30%, rgba(2, 132, 199, 0.04), transparent 40%);
      background-attachment: fixed;
      position: relative;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
    }

    /* Реалистичная уличная камера видеонаблюдения */
    .bg-cctv-widget {
      position: fixed;
      top: 100px;
      right: 30px;
      width: 220px;
      height: 200px;
      z-index: 50;
      pointer-events: none;
      filter: drop-shadow(0 15px 35px rgba(15, 23, 42, 0.16));
      transition: opacity 0.3s;
    }
    @media (max-width: 1100px) {
      .bg-cctv-widget {
        display: none;
      }
    }

    .cctv-rec-indicator {
      animation: cctvBlink 1.4s infinite;
    }
    @keyframes cctvBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Верхняя сервисная строка */
    .top-bar {
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-muted);
      padding: 8px 0;
      background: #f1f5f9;
      position: relative;
      z-index: 1001;
    }
    .top-bar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #334155;
      font-weight: 600;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--green-stock);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-stock);
    }
    .top-nav {
      display: flex;
      gap: 16px;
    }
    .top-nav a {
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .top-nav a:hover { color: var(--red-accent); }
    .top-contacts {
      display: flex;
      gap: 18px;
    }
    .top-contacts a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .top-contacts a:hover { color: var(--red-accent); }

    /* Шапка сайта */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .header-inner {
      display: grid;
      grid-template-columns: 210px 140px 1fr auto;
      gap: 20px;
      align-items: center;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .logo span { color: var(--red-accent); }
    .logo-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      border: 1px solid var(--border);
      color: #0369a1;
      font-weight: 700;
    }

    .btn-catalog {
      background: linear-gradient(135deg, var(--red-accent), #be123c);
      border: none;
      color: #fff;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--red-glow);
      transition: all 0.2s ease;
    }
    .btn-catalog:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.35);
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }
    .search-input {
      width: 100%;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 44px 12px 18px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      background: #fff;
      border-color: var(--cyan-accent);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .search-clear {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      display: none;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cart-btn {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .cart-btn:hover { border-color: #cbd5e1; background: #f8fafc; }
    .cart-badge {
      background: var(--red-accent);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 12px;
    }

    /* Выпадающее мега-меню */
    .mega-catalog-menu {
      display: none;
      position: fixed;
      top: 72px;
      left: 0;
      width: 100%;
      background: #ffffff;
      border-bottom: 2px solid var(--red-accent);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      z-index: 1500;
      padding: 36px 0;
      animation: menuSlideDown 0.2s ease-out forwards;
    }
    .mega-catalog-menu.active { display: block; }
    
    @keyframes menuSlideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mega-catalog-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
    }
    .mega-group h4 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #0369a1;
      margin-bottom: 14px;
      font-family: var(--font-mono);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mega-group ul { list-style: none; }
    .mega-group li { margin-bottom: 10px; }
    .mega-group a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      display: inline-block;
      transition: all 0.2s;
    }
    .mega-group a:hover {
      color: var(--red-accent);
      transform: translateX(4px);
    }

    /* Hero-секция */
    .hero {
      padding: 50px 0 30px;
      position: relative;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 32px;
    }
    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    }
    .hero-card h1 {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 16px;
      letter-spacing: -1px;
      color: #0f172a;
    }
    .hero-card h1 span {
      color: var(--red-accent);
    }
    .hero-card p {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 540px;
      margin-bottom: 32px;
    }
    .hero-stats {
      display: flex;
      gap: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .stat-val {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
    }
    .stat-lbl {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Блок расчета спецификации */
    .spec-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }
    .spec-card h3 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #0f172a;
    }
    .spec-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
