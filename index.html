<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-950 text-slate-100 antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПРОМСЕТЬ | Федеральная B2B Экосистема Промышленного Снабжения</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              400: '#38bdf8',
              500: '#0284c7',
              600: '#0369a1',
              accent: '#06b6d4',
              neon: '#10b981',
              amber: '#f59e0b',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar for dense enterprise tables */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
      box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.2);
    }
    .glow-cyan {
      box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.35);
    }
    @media print {
      body * { visibility: hidden; }
      #printableInvoice, #printableInvoice * { visibility: visible; }
      #printableInvoice { position: absolute; left: 0; top: 0; width: 100%; color: #000 !important; background: #fff !important; }
    }
  </style>
</head>
<body class="min-h-full flex flex-col font-sans selection:bg-cyan-500 selection:text-white bg-slate-950 text-slate-100 relative overflow-x-hidden">

<!-- B2B Global Status Topbar -->
<header class="sticky top-0 z-40 w-full border-b border-slate-800/80 glass-panel">
  <!-- Micro info tier -->
  <div class="border-b border-slate-800/60 bg-slate-950/70 py-1.5 px-4 sm:px-6 text-xs text-slate-400">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <!-- Left: Entity & 1C Sync -->
      <div class="flex items-center gap-4 flex-wrap">
        <div class="flex items-center gap-2">
          <span class="inline-flex h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-slate-300 font-medium">Шлюз 1С:ERP:</span>
          <span class="text-emerald-400 font-mono text-[11px]">Онлайн (задержка 0.4 сек)</span>
        </div>
        <span class="text-slate-700">|</span>
        <!-- Warehouse Picker -->
        <div class="flex items-center gap-1.5 cursor-pointer hover:text-cyan-400 transition" onclick="toggleWarehouseDropdown()">
